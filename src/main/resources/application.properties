server.port=8080

# Data kit folder (relative to where you start the app)
opsagent.data-dir=data
# Every action event is appended here as JSON lines (leave empty for memory only)
opsagent.audit-file=audit/audit-log.jsonl
# Kill switch: false = the agent applies nothing on its own, every action needs approval
opsagent.auto-apply-enabled=true
# Loop limits: max model calls per question, max tool executions per question
opsagent.max-iterations=12
opsagent.max-tool-calls=30

# Never commit a key: it is read from the ANTHROPIC_API_KEY environment variable
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.base-url=https://api.anthropic.com
anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-5-5}
anthropic.max-tokens=4096
anthropic.timeout-seconds=120

# Pretty JSON responses (easier to read in curl / the video)
spring.jackson.serialization.indent-output=true
spring.jackson.serialization.write-dates-as-timestamps=false
